services:
  - type: web
    name: scamshield-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SCAMSHIELD_AI_PROVIDER
        value: xai
      - key: GROK_MODEL
        value: grok-4.7
      - key: XAI_API_KEY
        sync: false
