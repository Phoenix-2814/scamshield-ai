openapi: 3.1.0
info:
  title: ScamShield API
  version: 1.0.0
  description: Privacy-conscious analysis prototype. Message and media contents are processed in memory and are not persisted by this service. If configured, extracted URLs are sent to VirusTotal, whose API adds submitted or queried URLs to its community dataset. Media files are sent to Groq for visual analysis and video transcription.
servers:
  - url: /
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Check service health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, service, requestId]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, const: scamshield-api }
                  requestId: { type: string, format: uuid }
  /api/config:
    get:
      operationId: getAnalysisConfig
      summary: Read available analysis modes
      responses:
        '200':
          description: Public analysis configuration; no credentials are returned
          content:
            application/json:
              schema:
                type: object
                required: [analysisModes, aiAssistedAvailable, externalProvider, requestId]
                properties:
                  analysisModes:
                    type: array
                    items: { type: string, enum: [rules, ai-assisted] }
                  aiAssistedAvailable: { type: boolean }
                  mediaAnalysisAvailable: { type: boolean }
                  externalProvider: { type: [string, 'null'] }
                  virusTotalAvailable: { type: boolean }
                  requestId: { type: string, format: uuid }
  /api/analyze-media:
    post:
      operationId: analyzeMedia
      summary: Review image or video content and possible AI-generation signs
      description: Accepts JPEG, PNG, WebP, GIF, MP4, or WebM up to 20 MB. The browser sends up to three JPEG preview frames for visual review; the original video is also sent to Groq Whisper for audio transcription. Results are estimates, not proof of origin. Media is processed in memory and sent to Groq.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, frames]
              properties:
                file: { type: string, format: binary }
                frames: { type: string, description: JSON array of up to three data URL previews }
      responses:
        '200':
          description: Media content and tentative origin assessment
          content:
            application/json:
              schema:
                type: object
                required: [requestId, mediaAnalysis]
                properties:
                  requestId: { type: string, format: uuid }
                  mediaAnalysis:
                    type: object
                    properties:
                      mediaType: { type: string, enum: [image, video] }
                      summary: { type: string }
                      visibleText: { type: array, items: { type: string } }
                      claims: { type: array, items: { type: string } }
                      safetyConcerns: { type: array, items: { type: string } }
                      authenticity:
                        type: object
                        properties:
                          verdict: { type: string, enum: [likely_ai_generated, no_clear_ai_signs, unclear] }
                          confidence: { type: string, enum: [low, medium, high] }
                          reasons: { type: array, items: { type: string } }
                          caveat: { type: string }
                      metadataIndicators: { type: array, items: { type: string } }
                      transcript: { type: string }
                      transcriptStatus: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/analyze:
    post:
      operationId: analyzeMessage
      summary: Analyze a message for configured warning patterns
      description: When configured, URLs in the message are automatically checked with VirusTotal and may be added to its community dataset. Do not submit confidential or personal URLs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 5000
                useAiAnalysis:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Explainable heuristic analysis
          content:
            application/json:
              schema:
                type: object
                required: [requestId, analysis]
                properties:
                  requestId: { type: string, format: uuid }
                  analysis:
                    type: object
                    required: [score, level, categories, signals, advice, mode]
                    properties:
                      score: { type: integer, minimum: 0, maximum: 100 }
                      level: { type: string, enum: [Low, Medium, High] }
                      mode: { type: string, enum: [rules, ai-assisted] }
                      assessment:
                        type: object
                        properties:
                          scamType: { type: string }
                          summary: { type: string }
                      urlChecks:
                        type: object
                        required: [configured, results, skipped]
                        properties:
                          configured: { type: boolean }
                          skipped: { type: integer, minimum: 0 }
                          results:
                            type: array
                            items:
                              type: object
                              required: [url, status]
                              properties:
                                url: { type: string }
                                status: { type: string, enum: [malicious, suspicious, no_detections, unrated, pending, not_submitted, unavailable, not_configured] }
                                malicious: { type: integer, minimum: 0 }
                                suspicious: { type: integer, minimum: 0 }
                                harmless: { type: integer, minimum: 0 }
                                undetected: { type: integer, minimum: 0 }
                                detections: { type: integer, minimum: 0 }
                                total: { type: integer, minimum: 0 }
                                reportUrl: { type: string, format: uri }
                                message: { type: string }
                      categories:
                        type: array
                        items: { type: string }
                      signals:
                        type: array
                        items:
                          type: object
                          required: [name, category, points, evidence, advice]
                          properties:
                            name: { type: string }
                            category: { type: string }
                            points: { type: integer, minimum: 0 }
                            evidence: { type: string }
                            explanation: { type: string }
                            advice: { type: string }
                      advice:
                        type: array
                        items: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  responses:
    BadRequest:
      description: Invalid JSON or message input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooLarge:
      description: Request body or message exceeds configured size
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMediaType:
      description: Request is not application/json
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Per-process request limit exceeded; retry after the Retry-After interval
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: AI provider is not configured or could not complete the analysis
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string, format: uuid }
